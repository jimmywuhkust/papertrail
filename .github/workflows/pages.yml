name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Build agent database and static API
        run: npm run agents:build
      - name: Verify agent queries and tools
        run: npm run agents:test
      - name: Static export build
        run: npm run build
        env:
          GH_PAGES: "true"
      # vinext nests the exported site under dist/client/<basePath>; GitHub
      # Pages already mounts the artifact at /<repo>, so the inner directory
      # is the correct site root. The root-level 404.html becomes the custom
      # 404 page.
      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/pages
          cp -r dist/client/papertrail/. dist/pages/
          cp dist/client/404.html dist/pages/404.html
          python -c "from pathlib import Path; size=sum(p.stat().st_size for p in Path('dist/pages').rglob('*') if p.is_file()); print(f'Pages artifact: {size:,} bytes'); assert size < 1_000_000_000"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
