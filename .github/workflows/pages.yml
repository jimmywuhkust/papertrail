name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Build agent database and static API
        run: npm run agents:build
      - name: Verify agent queries and tools
        run: npm run agents:test
      - name: Static export build
        run: npm run build
        env:
          GH_PAGES: "true"
      # vinext nests the exported site under dist/client/<basePath>; GitHub
      # Pages already mounts the artifact at /<repo>, so the inner directory
      # is the correct site root. The root-level 404.html becomes the custom
      # 404 page.
      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/pages
          cp -r dist/client/papertrail/. dist/pages/
          # Episode videos are hosted on the daily-videos GitHub Release;
          # shipping them on Pages would blow the artifact size budget.
          rm -f dist/pages/daily/*.mp4
          cp dist/client/404.html dist/pages/404.html
          python -c "from pathlib import Path; size=sum(p.stat().st_size for p in Path('dist/pages').rglob('*') if p.is_file()); print(f'Pages artifact: {size:,} bytes'); assert size < 1_000_000_000"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The site artifact is ~830MB, and actions/deploy-pages polls for at most
      # 10 minutes (hard cap) and then CANCELS the server-side deployment, which
      # made most deploys fail. Create the deployment via the REST API instead
      # and poll without ever cancelling, so the sync can run as long as needed.
      - id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          art=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            | jq -r '[.artifacts[] | select(.name=="github-pages" and (.expired|not))][0].id')
          if [ -z "$art" ] || [ "$art" = "null" ]; then echo "github-pages artifact not found"; exit 1; fi
          echo "Artifact id: $art"
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          resp=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments" \
            -d "$(jq -n --argjson artifact_id "$art" --arg pages_build_version "$GITHUB_SHA" --arg oidc_token "$oidc" \
                 '{artifact_id:$artifact_id, pages_build_version:$pages_build_version, oidc_token:$oidc_token}')")
          echo "$resp" | jq 'del(.oidc_token)'
          dep_id=$(echo "$resp" | jq -r '.id // (.status_url | split("/") | last)')
          echo "page_url=$(echo "$resp" | jq -r '.page_url // ""')" >> "$GITHUB_OUTPUT"
          echo "Deployment id: $dep_id"
          for i in $(seq 1 130); do
            sleep 20
            status=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/$dep_id" | jq -r .status 2>/dev/null) || status="poll_error"
            echo "[$i] $status"
            case "$status" in
              succeed) exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "Deployment failed with status: $status"; exit 1 ;;
            esac
          done
          echo "No terminal status after ~43min; deployment continues server-side"
          exit 1
